<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>X Likes Export Status</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0 auto;
        padding: 24px;
        max-width: 720px;
        color: #111827;
        line-height: 1.5;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px 0;
      }
      p {
        color: #4b5563;
        margin: 0 0 14px 0;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #111827;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      pre {
        margin-top: 18px;
        padding: 14px;
        border-radius: 10px;
        background: #f3f4f6;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 180px;
      }
    </style>
  </head>
  <body>
    <h1>X Likes Export</h1>
    <p>使用当前已登录的 X 账号，在后台自动识别账号并导出自己的 Likes。</p>
    <button id="exportBtn">Export My Likes</button>
    <pre id="status">Ready.</pre>
    <script src="popup.js"></script>
  </body>
  </html>
